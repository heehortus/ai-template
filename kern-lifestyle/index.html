<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KERN — Collections</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor__label" id="cursorLabel"></span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- GNB -->
  <header class="gnb">
    <a class="gnb__logo" href="index.html">KERN</a>
    <div class="gnb__wrap" id="gnbWrap">
      <div class="gnb__toggle" role="button" tabindex="0" aria-label="메뉴" aria-expanded="false">
        <svg class="gnb__icon gnb__icon--ham" viewBox="0 0 14 10" fill="none" width="14" height="10" aria-hidden="true">
          <path d="M0 1H14M0 5H14M0 9H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="gnb__icon gnb__icon--close" viewBox="0 0 12 12" fill="none" width="12" height="12" aria-hidden="true">
          <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="gnb__label" aria-hidden="true">menu</span>
      <nav class="gnb__nav" aria-label="주요 메뉴">
        <a class="gnb__item" href="index.html" data-page="index">
          <svg class="gnb__bullet" viewBox="0 0 6 6" width="6" height="6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>
          Collections
        </a>
        <a class="gnb__item" href="about.html" data-page="about">
          <svg class="gnb__bullet" viewBox="0 0 6 6" width="6" height="6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>
          About
        </a>
        <a class="gnb__item" href="contact.html" data-page="contact">
          <svg class="gnb__bullet" viewBox="0 0 6 6" width="6" height="6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>
          Contact
        </a>
      </nav>
    </div>
  </header>

  <!-- Draggable Canvas -->
  <div class="col-canvas-wrap" id="canvasWrap">
    <div class="col-canvas-scaler" id="canvasScaler">
      <div class="col-canvas-inner" id="canvasInner">
        <!-- Products injected by script.js -->
      </div>
    </div>
  </div>

  <!-- Product Detail Panel -->
  <aside class="panel" id="panel" aria-hidden="true" aria-label="제품 상세">
    <span class="panel__close" id="panelClose" role="button" tabindex="0" aria-label="닫기">×</span>
    <div class="panel__inner">
      <p class="panel__season" id="panelSeason"></p>
      <h2 class="panel__name" id="panelName"></h2>
      <div class="panel__thumbs" id="panelThumbs"></div>
      <div class="panel__featured" id="panelFeatured"></div>
      <p class="panel__desc" id="panelDesc"></p>
      <p class="panel__material" id="panelMaterial"></p>
    </div>
  </aside>
  <div class="panel__overlay" id="panelOverlay" aria-hidden="true"></div>

  <!-- Canvas Hint -->
  <div class="canvas-hint" id="canvasHint" aria-hidden="true">
    <span class="canvas-hint__drag">
      <svg viewBox="0 0 16 16" fill="none" width="14" height="14" aria-hidden="true">
        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M6 4L8 2L10 4M6 12L8 14L10 12M4 6L2 8L4 10M12 6L14 8L12 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Drag to explore
    </span>
    <div class="canvas-hint__zoom">
      <span class="canvas-hint__btn" id="zoomOut" role="button" tabindex="0" aria-label="축소">−</span>
      <span class="canvas-hint__btn" id="zoomIn"  role="button" tabindex="0" aria-label="확대">+</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
